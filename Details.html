<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="https://kit.fontawesome.com/74e6607f1f.js" crossorigin="anonymous"></script>
    <script type="module" src="js/detailsApp.js"></script>
    <title>Cineisternas filmklubb</title>
</head>

<body>
    <nav class="flex-container navigation">
        <div class="flex-container pages">
          <ul class="menu ">
            <li><a href="Index.html">Hem</a></li>
               
          </ul>
    
          <div class="hamburger">
            <i class="fa-solid fa-bars"></i>
           </div>
    
        </div>  
        <div class="flex-container searchAndSettings">
          <ul class="menu">
            <li>
              <a href="userPage.html">
                <i class="fa-solid fa-user"></i>
              </a>
          </li>
          </ul>
          <div class="searchbar">
            <form article id="searchForm">
              <input type="text" id="searchInput" placeholder="Sök..." name="search" autocomplete="off">
            </form>
          </div>
        </div>
        </nav>
        
        <div id="searchSuggestions" class="suggestions"></div>
        
    <main>
        <div class="search-container">
            <section class="flex-container" id="detailsMovie">
                <article class="topMovie flex-container">
                    <div class="flex-container flex-item">
                        
                      </div>
                    <div class="flex-container movieInfoAndRating">
                    
                    <div class="shortInfoOnMovie flex-container">
                    
                      
                    </div>
                      
                     
                      
                      <div class="btnRating flex-container">
                       
                      </div>
                    </div>
                </article>
            </section>
    
            <section class="flex-container actors" id="actorsDiv">
                
            </section>
            <div id="messageBox"></div>

            <div id="alertBox" class="alert-box">
              <button class="close-btn" id="btnCloseAlert">x</button>
              <p id="varningsText"></p>
          </div>

          <div id="customConfirm" class="confirm">
            <div class="confirm-content">
              <p>Är du säker på att du vill ta bort din recension?</p>
              <button type="button" id="confirmYes">Ja</button>
              <button type="button" id="confirmNo">Nej</button>
            </div>
          </div>

            <div class="flex-container rewiev">
                <section class="recensionMovie flex-container" id="containerForm">
                    <h2 id="formHeader">Skriv en recension</h2>
                    
                    <div class="recensionForm">
                        <form  id="reviewForm">
                            <div class="containerBtnRating flex-container" id="setCmdbScore">
                                <button class="btnRating" id="btnNegative" data-rating="-1">-1</button>
                                <button class="btnRating" id="btn1" data-rating="1">1</button>
                                <button class="btnRating" id="btn2" data-rating="2">2</button>
                                <button class="btnRating" id="btn3" data-rating="3">3</button>
                               <button class="btnRating" id="btn4" data-rating="4">4</button>
                               <button class="btnRating" data-rating="5">5</button>
                              </div>
                            <label for="Titel">Titel</label>
                            <input type="text" id="titleTxt" name="nameTxt" placeholder="Titel på din recension...">
                            <br/>
                            <label for="recesnsionText">Information</label>
                            <input type="text" id="recensionText" name="recensionText" placeholder="Berätta för oss vad du tyckte om filmen!">
                            <br/>
                            <input type="submit" value="submit">
                        </form>
                    </div>
                </section>
    
                <section class="flex-container userReviews" id="userReviews">
                    <div class="flex-container userReview">
                        User review
                    </div>
                    <div class="flex-container userReview">
                        User review
                    </div>
                    <div class="flex-container userReview">
                        User review
                    </div>
                </section>
            </div>

        </div>
       
     

        

    </main>

    <footer>
        <a href="#">Kontakta oss</a>
        <h4>@2024Cineisterna</h4>
    </footer>
   
</body>
