<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="https://kit.fontawesome.com/74e6607f1f.js" crossorigin="anonymous"></script>
    <script type="module" src="js/app.js"></script>
    <title>Cineisternas filmklubb</title>
</head>

<body>
    <nav class="flex-container navigation">
        <div class="flex-container pages">
          <ul class="menu ">
            <li><a href="Index.html">Hem</a></li>
                <li><a href="#">Filmer</a></li>
                <li><a href="#">Serier</a></li>
          </ul>
    
          <div class="hamburger">
            <i class="fa-solid fa-bars"></i>
           </div>
    
        </div>  
        <div class="flex-container searchAndSettings">
          <ul class="menu">
                <li><a href="#">Profil</a></li>
          </ul>
          <div class="searchbar">
            <a href="search.html">
                <form article="searchbar">
                    <input type="text" placeholder="Sök..." name="search">
                </form>
            </a>
        </div>
        </div>
        </nav>

        <main class="flex-container userPage">
          <div class="flex-container content">
            <div class="flex-container userInfo">
              <img class="flex-item" id="userPic" src="Images/profilbild.png">
              <div class="flex-container" id="userName">
                <h3>Förnamn Efternamn</h3>
              </div>
            </div>
  
            <div class="flex-container containerStatistics">
              <div class="containerProgressBars flex-container" id="progressBars">
                
              </div>
             
              <div class="flex-container " id="userStatistics">
                <div class="flex-item userDataPicture" id="userScore">
                  <p data-product-id="userGeneralRating">2.3</p>
                  <img src="Images/poppe3.png">
                </div>
                <div class="flex-item userDataPicture">
                  <p data-product-id="userMoviesRated">6</p>
                  <img src="Images/camera.png">
                </div>
                <div class="flex-item userDataPicture" id="userTv">
                  <p data-product-id="userSeriesRated">2</p>
                  <img src="Images/tv.png">
                </div>
              </div>
            </div>

            <div class="flex-container rated">
              <h3 id="ratedItems">Reviews</h3>
  
              <div class="flex-container" id="containerRatedMovies">

              </div>
            </div>
          </div>

          
          
        </main>

        <footer>
          <a href="#">Kontakta oss</a>
          <h4>@2024Cineisterna</h4>
      </footer>
</body> 

</html>
