<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="https://kit.fontawesome.com/74e6607f1f.js" crossorigin="anonymous"></script>
    <script type="module" src="js/indexApp.js"></script>
    <title>Cineisternas filmklubb</title>
</head>
<body>

   <header class="flex-container">
    <img class="flex-item" src="Images/poppe4.png">
    <h1>Cinersiternas filmklubb</hi>
   </header>

   <nav class="flex-container navigation">
    <div class="flex-container pages">
      <ul class="menu ">
        <li><a href="Index.html">Hem</a></li>
           
      </ul>

      <div class="hamburger">
        <i class="fa-solid fa-bars"></i>
       </div>

    </div>  
    <div class="flex-container searchAndSettings">
      <ul class="menu">
        <li>
          <a href="userPage.html">
            <i class="fa-solid fa-user"></i>
          </a>
      </li>
      </ul>
      <div class="searchbar">
        <form article id="searchForm">
          <input type="text" id="searchInput" placeholder="Sök..." name="search" autocomplete="off">
        </form>
      </div>
    </div>
    </nav>
    
    <div id="searchSuggestions" class="suggestions"></div>

    <div id="alertBox" class="alert-box">
      <button class="close-btn" id="btnCloseAlert">X</button>
      <p id="varningsText"></p>
  </div>

    <div id="ratingModal" class="modal">
      <div class="modal-content">
          <span class="close" id="closeModal">&times;</span>
          <h2>Betygsätt filmen</h2>
          <div id="starRating">
              <button class="star negative" data-rating="-1">&#9733;</button>
              <button class="star" data-rating="1">&#9733;</button>
              <button class="star" data-rating="2">&#9733;</button>
              <button class="star" data-rating="3">&#9733;</button>
              <button class="star" data-rating="4">&#9733;</button>
              <button class="star" data-rating="5">&#9733;</button>
          </div>
          <button id="submitRating">Skicka betyg</button>
      </div>
  </div>
  
    <main class="clearfix flex-container">
      <section class="flex-container topThree" id="topList">

        <article class="topMovie flex-container">
        </article>

        <div class="flex-container topTwoAndThree">

          <article class="flex-container topMovies">
          </article>

          <article class="flex-container topMovies" >
          </article>
        </div>
      </section> 

      <section class="listOfTen flex-container">
        <div class="flex-container">
          <h3 class="subHeader">Top 10 bästa filmerna!</h3>
        </div>
        <div class="flex-container top10ListMovie" id="topTenMovies">
          
        </div>
      </section>

      
      <section>
        <div class="flex-container">
          <h3 class="subHeader">Top 10 bästa Tv serierna!</h3>
        </div>
        <div class="flex-container top10ListSeries" id="topTenSeries">
         
        </div>
      </section>

    </main>

    <footer>
      <a href="#">Kontakta oss</a>
      <h4>@2024Cineisterna</h4>
  </footer>

  

</body>
</html>
